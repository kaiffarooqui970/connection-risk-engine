name: collect
# Hourly live ingestion from DB Timetables v1 (plan + change feed) for the hub stations.
on:
  schedule:
    - cron: "7 * * * *"   # minute 7: avoid the top-of-hour rush on shared runners
  workflow_dispatch:

concurrency:
  group: collect          # never two writers on the same store
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Restore live store
        uses: actions/cache/restore@v4
        with:
          path: data/live_store.duckdb
          key: live-store-${{ github.run_id }}
          restore-keys: live-store-
      - name: Collect
        env:
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
        run: uv run python -m cre.ingest.db_api
      - name: Save live store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/live_store.duckdb
          key: live-store-${{ github.run_id }}
